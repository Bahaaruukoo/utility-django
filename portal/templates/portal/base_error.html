{% load roles %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ request.tenant.name }} Utility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

    <style>
        .sidebar {
        width: 250px;
        min-height: 100vh;
        background-color: #1f2d3d;
        color: white;
        transition: width 0.3s ease;
    }

.sidebar.collapsed {
    width: 70px;
}

.sidebar a {
    color: #c2c7d0;
    text-decoration: none;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.sidebar a:hover {
    background-color: #2e3f55;
    color: white;
}

.sidebar .menu-title {
    padding: 15px 20px 5px;
    font-size: 11px;
    text-transform: uppercase;
    color: #6c757d;
}
.menu-toggle {
    cursor: pointer;
    color: #c2c7d0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.menu-toggle:hover {
    background-color: #2e3f55;
    color: white;
}

.menu-link {
    padding: 10px 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #c2c7d0;
    text-decoration: none;
}

.menu-link:hover {
    background-color: #34495e;
    color: white;
}

.menu-link.active {
    background-color: #0d6efd;
    color: white;
    border-left: 3px solid #fff;
}

.sidebar.collapsed .menu-title,
.sidebar.collapsed span,
.sidebar.collapsed .sidebar-title {
    display: none;
}

.alert {
    padding: 4px 8px;   /* reduce vertical + horizontal padding */
    margin-bottom: 6px; /* reduce space between messages */
    font-size: 14px;    /* optional: smaller text */
}


#mainContent {
    transition: margin-left 0.3s ease;
}

    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div class="d-flex">


        <!-- Main Content -->
        <div id="mainContent" class="flex-grow-1">
            <!-- Top Navbar -->
            <nav class="navbar navbar-light  border-bottom px-4" style='background-color: #7e81833b;'>
                <div class="ms-auto d-flex align-items-center">
                    <strong class="me-3"><a style="text-decoration: none; color: black;" href="{% url 'portal_home' %}">{{ request.branch.name }}</a></strong>
                    
                </div>
                 <div class="dropdown">
                    <button class="btn btn-outline-danger btn-sm dropdown-toggle text-dark"
                            type="button"
                            id="dropdownMenu2"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        {{ request.user.email }}
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end"
                        aria-labelledby="dropdownMenu2">
                        <li><a class="dropdown-item" href="{% url 'account_dashboard' %}">Account</a></li>
                        <li><a class="dropdown-item" href="{% url 'profile' %}">Profile</a></li>
                        <li>
                            <a href="{% url 'account_logout' %}" class="dropdown-item">
                                Logout
                            </a>
                        </li>
                    </ul>
                </div>

            </nav>

            <div class="">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                {% block content %}

                {% endblock %}
            </div>
        </div>

    </div>
    <div>
        
    <footer class=" py-3 bg-light border-top">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
            <span class="text-muted">
                © {{ now|date:"Y" }} Grid Command Center
            </span>

            <div class="mt-2 mt-md-0">
                <a href="#" class="text-muted me-3">Privacy</a>
                <a href="#" class="text-muted me-3">Terms</a>
                <a href="#" class="text-muted">Support</a>
            </div>
        </div>
    </footer>

    </div>

<!-- Bootstrap JS (Place before closing body) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>




</body>
</html>
