{% extends "portal/base.html" %}
{% block content %}

<div class="container mt-1">

    {% include 'reports/report_dashboard_header.html' %}
    <h4 class="mb-1">Monthly Billing Report</h4>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="row g-3">

            <!-- Year -->
            <div class="col-12 col-md-4">
                <label class="form-label">Year</label>
                {{ form.year }}
            </div>

            <!-- Month -->
            <div class="col-12 col-md-4">
                <label class="form-label">Month</label>
                <select name="month" class="form-select">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <!-- Force checkbox -->
            <div class="col-12 col-md-4 d-flex align-items-end ps-4">
                <div class="row">
                    <div class="form-check mb-2 ms-4">
                        {{ form.force }}
                        <label for="id_force" class="form-check-label">Compute new report</label>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary ">
                            Generate
                        </button>
                    </div>
                </div>
            </div>

        </div>

        

    </form>

</div>

{% endblock %}
